<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Quickers Creator Network">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page Not Found | Quickers Creator Network</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- ===== FAVICON - Replace with your logo ===== -->
    <link rel="icon" type="image/png" href="assets/images/logo-favicon.png">
    <link rel="apple-touch-icon" href="assets/images/logo-apple.png">
    
    <style>
        .error-404 {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 0;
            background: var(--bg-gradient);
            position: relative;
            overflow: hidden;
        }
        
        .error-404 .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float-orb 8s ease-in-out infinite;
        }
        .error-404 .gradient-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -10%;
            right: -5%;
        }
        .error-404 .gradient-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: var(--secondary);
            bottom: -10%;
            left: -5%;
            animation-delay: 2s;
        }
        .error-404 .gradient-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: var(--accent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }
        
        @keyframes float-orb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        
        .error-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 600px;
        }
        
        /* ===== LOGO STYLES FOR 404 PAGE ===== */
        .error-logo {
            width: 100px;
            height: auto;
            display: block;
            margin: 0 auto 1.5rem;
            animation: float 3s ease-in-out infinite;
        }
        
        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2rem;
        }
        
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--border-glass);
            opacity: 0.1;
            animation: float-shape 20s linear infinite;
        }
        .floating-shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 5%;
            animation-duration: 25s;
            border-color: var(--primary);
        }
        .floating-shape:nth-child(2) {
            width: 120px;
            height: 120px;
            bottom: 15%;
            right: 8%;
            animation-duration: 30s;
            border-color: var(--secondary);
        }
        .floating-shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 20%;
            right: 15%;
            animation-duration: 20s;
            border-color: var(--accent);
        }
        .floating-shape:nth-child(4) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 10%;
            animation-duration: 28s;
            border-color: var(--primary-light);
        }
        
        @keyframes float-shape {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -40px) rotate(90deg); }
            50% { transform: translate(-20px, 30px) rotate(180deg); }
            75% { transform: translate(40px, -20px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        
        /* Logo hover effect */
        .error-logo:hover {
            animation: logoSpin 0.8s ease-in-out;
        }
        
        @keyframes logoSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .error-logo {
                width: 70px;
            }
        }
    </style>
</head>
<body>

<!-- ========== 404 CONTENT ========== -->
<div class="error-404">
    <!-- Background Orbs -->
    <div class="gradient-orb"></div>
    <div class="gradient-orb"></div>
    <div class="gradient-orb"></div>
    
    <!-- Floating Shapes -->
    <div class="floating-shapes">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>
    
    <div class="error-content animate-on-scroll visible">
        <!-- ===== REPLACED ⚡ WITH YOUR LOGO ===== -->
        <img src="logo.JPG" alt="Quickers Creator Network" class="error-logo">
        
        <div class="error-code">404</div>
        <h1 style="font-size: clamp(1.8rem, 4vw, 2.8rem); margin: 0.5rem 0;">
            Page Not <span class="text-gradient">Found</span>
        </h1>
        <p style="font-size: 1.1rem; color: var(--text-secondary); max-width: 450px; margin: 0 auto;">
            Oops! The page you're looking for doesn't exist or has been moved.
            Let's get you back on track.
        </p>
        
        <div class="error-actions">
            <a href="index.html" class="btn btn-primary btn-lg btn-ripple magnetic-btn">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="contact.html" class="btn btn-secondary btn-lg">
                <i class="fas fa-envelope"></i> Contact Support
            </a>
        </div>
        
        <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-glass);">
            <p style="font-size: 0.85rem; color: var(--text-muted);">
                Here are some helpful links:
            </p>
            <div style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-top: 0.8rem;">
                <a href="index.html" style="font-size: 0.85rem; color: var(--text-secondary); transition: var(--transition-base);">Home</a>
                <a href="about.html" style="font-size: 0.85rem; color: var(--text-secondary); transition: var(--transition-base);">About</a>
                <a href="services.html" style="font-size: 0.85rem; color: var(--text-secondary); transition: var(--transition-base);">Services</a>
                <a href="creators.html" style="font-size: 0.85rem; color: var(--text-secondary); transition: var(--transition-base);">Creators</a>
                <a href="blog.html" style="font-size: 0.85rem; color: var(--text-secondary); transition: var(--transition-base);">Blog</a>
                <a href="faq.html" style="font-size: 0.85rem; color: var(--text-secondary); transition: var(--transition-base);">FAQ</a>
                <a href="contact.html" style="font-size: 0.85rem; color: var(--text-secondary); transition: var(--transition-base);">Contact</a>
            </div>
        </div>
        
        <!-- Footer with logo instead of lightning bolt -->
        <div style="margin-top: 2rem; opacity: 0.3; font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 8px;">
            <img src="assets/images/logo-footer.png" alt="Quickers" style="height: 16px; width: auto; opacity: 0.5;">
            Quickers Creator Network • 2026
        </div>
    </div>
</div>

<!-- ========== JAVASCRIPT ========== -->
<script>
// Simple animation for 404 page
document.addEventListener('DOMContentLoaded', function() {
    // Animate the 404 number with a glitch effect
    const errorCode = document.querySelector('.error-code');
    if (errorCode) {
        setInterval(() => {
            if (Math.random() > 0.8) {
                errorCode.style.transform = 'skewX(' + (Math.random() * 4 - 2) + 'deg)';
                setTimeout(() => {
                    errorCode.style.transform = 'skewX(0deg)';
                }, 100);
            }
        }, 3000);
    }
    
    // Log a fun message
    console.log('🔍 404 - You seem lost! But you found a cool error page 😎');
    console.log('🎯 Try going back to the homepage: /index.html');
});
</script>
</body>
</html>
